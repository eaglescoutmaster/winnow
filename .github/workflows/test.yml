name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      WINNOW_ELEVATED_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Pester on Windows PowerShell 5.1 (engine, dry run, elevated primitives)
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

      - name: Catalog schema on PowerShell 7 (Test-Json)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/Catalog.Tests.ps1'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (fake shell, no system changes)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Catalogs against the JSON Schema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install jsonschema
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, jsonschema
          schema = json.load(open("catalog/unix.schema.json"))
          for name in ("linux", "macos"):
              jsonschema.validate(json.load(open("catalog/%s.json" % name)), schema)
              print(name, "ok")
          PY

      - name: State and plan against the shipped catalog (read-only)
        run: |
          python3 scripts/winnow.py state | tail -n 3
          python3 scripts/winnow.py plan --profile aggressive

      - name: Real plan, apply, revert on throwaway targets
        env:
          WINNOW_INTEGRATION: '1'
        run: bash tests/integration.sh
